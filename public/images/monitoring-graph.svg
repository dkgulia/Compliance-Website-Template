<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Gradient for line -->
  <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#03a9f4" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#00e676" stop-opacity="0.7"/>
  </linearGradient>
  
  <!-- Alert area gradient -->
  <linearGradient id="alertGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f44336" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#f44336" stop-opacity="0"/>
  </linearGradient>
  
  <!-- Axes -->
  <line x1="40" y1="250" x2="450" y2="250" stroke="#555" stroke-width="2"/>
  <line x1="40" y1="50" x2="40" y2="250" stroke="#555" stroke-width="2"/>
  
  <!-- Chart Line -->
  <path d="M 40 200 
           C 70 180, 90 190, 120 180 
           C 150 170, 180 160, 200 150 
           C 220 140, 240 120, 260 100
           L 280 140
           L 300 80
           L 320 90
           L 340 60
           L 360 120
           L 380 110
           C 400 180, 420 190, 450 170" 
        fill="none" stroke="url(#lineGradient)" stroke-width="3"/>
        
  <!-- Data Points -->
  <circle cx="120" cy="180" r="4" fill="#03a9f4"/>
  <circle cx="200" cy="150" r="4" fill="#03a9f4"/>
  <circle cx="260" cy="100" r="4" fill="#03a9f4"/>
  <circle cx="280" cy="140" r="4" fill="#03a9f4"/>
  <circle cx="300" cy="80" r="5" fill="#f44336"/> <!-- Alert point -->
  <circle cx="320" cy="90" r="4" fill="#03a9f4"/>
  <circle cx="340" cy="60" r="5" fill="#f44336"/> <!-- Alert point -->
  <circle cx="360" cy="120" r="4" fill="#03a9f4"/>
  <circle cx="380" cy="110" r="4" fill="#03a9f4"/>
  
  <!-- Alert Notifications -->
  <g transform="translate(300, 55)">
    <rect width="90" height="25" rx="5" fill="#f44336" opacity="0.9"/>
    <text x="45" y="17" font-family="Arial" font-size="12" fill="white" text-anchor="middle">ALERT: Breach</text>
  </g>
  
  <g transform="translate(340, 35)">
    <rect width="100" height="25" rx="5" fill="#f44336" opacity="0.9"/>
    <text x="50" y="17" font-family="Arial" font-size="12" fill="white" text-anchor="middle">ALERT: Policy Exp</text>
  </g>
  
  <!-- Alert highlight area -->
  <path d="M 290 250 
           L 290 80 
           L 310 80
           L 310 250" 
        fill="url(#alertGradient)" opacity="0.3"/>
        
  <path d="M 330 250 
           L 330 60 
           L 350 60
           L 350 250" 
        fill="url(#alertGradient)" opacity="0.3"/>
  
  <!-- Axis Labels -->
  <text x="250" y="280" font-family="Arial" font-size="12" fill="#aaa" text-anchor="middle">Time (days)</text>
  <text x="20" y="150" font-family="Arial" font-size="12" fill="#aaa" text-anchor="middle" transform="rotate(-90, 20, 150)">Risk Score</text>
  
  <!-- Legend -->
  <rect x="40" y="20" width="15" height="15" fill="url(#lineGradient)" rx="2"/>
  <text x="60" y="32" font-family="Arial" font-size="12" fill="#fff">Compliance Score</text>
  
  <circle cx="150" cy="27" r="5" fill="#f44336"/>
  <text x="160" y="32" font-family="Arial" font-size="12" fill="#fff">Alert Trigger</text>
</svg>