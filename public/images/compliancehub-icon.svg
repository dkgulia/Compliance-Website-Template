<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient for main shield -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115e59;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); transform-origin: 32px 32px; }
        to { transform: rotate(360deg); transform-origin: 32px 32px; }
      }
      .orbit { animation: rotate 20s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer orbit ring -->
  <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="#115e59" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Inner orbit ring -->
  <circle class="orbit" cx="32" cy="32" r="22" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.3" style="animation-direction: reverse;"/>

  <!-- Main shield shape -->
  <path d="M32 6 L52 16 L52 32 C52 44 44 52 32 58 C20 52 12 44 12 32 L12 16 Z"
        fill="url(#shieldGradient)"
        filter="url(#glow)"
        opacity="0.9"/>

  <!-- Shield inner highlight -->
  <path d="M32 10 L48 18 L48 32 C48 42 41 49 32 54 C23 49 16 42 16 32 L16 18 Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="0.5"
        opacity="0.3"/>

  <!-- Hub center circle -->
  <circle cx="32" cy="30" r="8" fill="#0d4744" stroke="#14b8a6" stroke-width="1.5"/>

  <!-- Checkmark inside hub -->
  <path class="pulse" d="M27 30 L30 33 L37 26"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Connection nodes -->
  <circle class="pulse" cx="32" cy="16" r="2" fill="#14b8a6"/>
  <circle class="pulse" cx="44" cy="26" r="2" fill="#14b8a6" style="animation-delay: 0.3s;"/>
  <circle class="pulse" cx="44" cy="38" r="2" fill="#14b8a6" style="animation-delay: 0.6s;"/>
  <circle class="pulse" cx="20" cy="26" r="2" fill="#14b8a6" style="animation-delay: 0.9s;"/>
  <circle class="pulse" cx="20" cy="38" r="2" fill="#14b8a6" style="animation-delay: 1.2s;"/>

  <!-- Connection lines to hub -->
  <line x1="32" y1="16" x2="32" y2="22" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>
  <line x1="44" y1="26" x2="40" y2="28" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>
  <line x1="44" y1="38" x2="40" y2="34" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="26" x2="24" y2="28" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="38" x2="24" y2="34" stroke="#14b8a6" stroke-width="0.5" opacity="0.6"/>
</svg>
